services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    volumes:
      # Persist SQLite, Chroma, uploads, and cloned repos
      - ./data:/appsense/data
      # Settings UI can update LLM keys / paths
      - ./.env:/appsense/.env
    ports:
      # Localhost only. Browsers use the frontend proxy, so 8000 stays off the public interface.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Local default is 5173. On EC2 set FRONTEND_PORT=80 in .env.
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
