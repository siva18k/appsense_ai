AWSTemplateFormatVersion: "2010-09-09"
Description: Single EC2 instance for AppSense. Docker Compose is installed at boot; deploy/ec2/deploy.sh copies the app and starts it.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC that contains SubnetId.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet (route to an internet gateway).
  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to open the site on port 80. Narrow this to your office or VPN range.
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
  InstanceType:
    Type: String
    Default: t4g.medium
    AllowedValues:
      - t4g.small
      - t4g.medium
      - t3.small
      - t3.medium

Conditions:
  IsArm: !Or
    - !Equals [!Ref InstanceType, t4g.small]
    - !Equals [!Ref InstanceType, t4g.medium]

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: appsense-ec2
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: appsense-ec2
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3AppSenseData
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: arn:aws:s3:::appsense-*
              - Sid: S3AppSenseDataObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: arn:aws:s3:::appsense-*/*
              - Sid: SessionManager
                Effect: Allow
                Action:
                  - ssm:UpdateInstanceInformation
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                  - ec2messages:AcknowledgeMessage
                  - ec2messages:DeleteMessage
                  - ec2messages:FailMessage
                  - ec2messages:GetEndpoint
                  - ec2messages:GetMessages
                  - ec2messages:SendReply
                Resource: "*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: appsense-ec2
      Roles:
        - !Ref InstanceRole

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AppSense web (port 80 only)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCidr
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: appsense-ec2

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroup
      ImageId: !If
        - IsArm
        - "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}"
        - "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 40
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker
          systemctl enable --now docker
          arch=$(uname -m)
          for plugin_dir in /usr/libexec/docker/cli-plugins /usr/local/lib/docker/cli-plugins; do
            mkdir -p "$plugin_dir"
            curl -fsSL "https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-linux-${arch}" -o "$plugin_dir/docker-compose"
            chmod 755 "$plugin_dir/docker-compose"
          done
          mkdir -p /opt/appsense
          chown ec2-user:ec2-user /opt/appsense
      Tags:
        - Key: Name
          Value: appsense

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags:
        - Key: Name
          Value: appsense

Outputs:
  WebsiteUrl:
    Description: Open this in a browser
    Value: !Sub "http://${ElasticIp}"
  PublicIp:
    Value: !Ref ElasticIp
  InstanceId:
    Value: !Ref Instance
